name: Compilar BBPTimer.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Compilar
        run: python -m PyInstaller --noconfirm --onefile --windowed --name BBPTimer --paths bbp_timer bbp_timer\main.py

      - name: Publicar en Releases (tag "latest")
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/BBPTimer.exe \
            --title "BBPTimer (última versión)" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}. Descargá BBPTimer.exe y abrilo con doble clic."
